<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="group" aria-labelledby="title desc">
  <title id="title">Lower and upper bound exponents for non-anytime and anytime gradient descent</title>
  <desc id="desc">Two aligned exponent tracks summarize recent progress. On the non-anytime track, the new lower-bound exponent reaches the silver exponent p sil, where the silver-schedule upper-bound segment begins. On the anytime track, the new lower-bound exponent reaches p any, where the best known anytime upper-bound segment begins. Open purple endpoints indicate agreement of polynomial exponents without asserting an exact endpoint lower bound. Author names link to the corresponding papers or blog posts.</desc>

  <defs>
    <style>
      .rate {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 32px;
        font-style: italic;
        fill: #2e2b27;
      }
      .exponent {
        font-size: 18px;
        font-style: normal;
      }
      .subscript {
        font-size: 70%;
        font-style: normal;
      }
      .rate-work {
        font-weight: 700;
        fill: #6f3f8f;
      }
      .parameter {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 16px;
        font-style: italic;
        fill: #57534d;
      }
      .guide {
        stroke: #3d4934;
        stroke-width: 1.8;
        stroke-dasharray: 6 7;
      }
      .track {
        stroke: #afb6bb;
        stroke-width: 2.2;
      }
      .segment {
        stroke-width: 10;
        stroke-linecap: butt;
      }
      .segment-work {
        stroke-width: 14;
        stroke-linecap: butt;
      }
      .row-label {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 20px;
        font-style: italic;
        font-weight: 700;
        text-anchor: middle;
        fill: #6f6a63;
      }
      .side-label {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 18px;
        font-style: italic;
        font-weight: 700;
        fill: #6f6a63;
      }
      .lower-a { stroke: #ad5c37; fill: #7a3518; }
      .lower-b { stroke: #d1926e; fill: #8b4f31; }
      .lower-c { stroke: #e2b15b; fill: #8f6115; }
      .lower-d { stroke: #d89024; fill: #7d4b0c; }
      .lower-e { stroke: #cf7b10; fill: #743f00; }
      .work { stroke: #6f3f8f; fill: #6f3f8f; }
      .upper-a { stroke: #83ad74; fill: #426b3d; }
      .upper-b { stroke: #4f8150; fill: #315b34; }
      .name {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        font-weight: 700;
        text-anchor: middle;
      }
      a { cursor: pointer; }
      a:hover .name, a:focus-visible .name { text-decoration: underline; }
      a:focus-visible { outline: 2px solid #7b3f1d; outline-offset: 3px; }
      .name.lower-a,
      .name.lower-b,
      .name.lower-c,
      .name.lower-d,
      .name.lower-e,
      .name.work,
      .name.upper-a,
      .name.upper-b {
        paint-order: stroke fill;
        stroke: #fffdf8;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
    </style>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555c60"/>
    </marker>
  </defs>

  <rect width="1400" height="570" fill="#fffdf8"/>

  <!-- Non-anytime exponent labels. -->
  <text class="rate" x="240" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−2</tspan></text>
  <text class="rate" x="306.6" y="62" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.932</tspan></text>
  <text class="rate" x="502.7" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.7321</tspan></text>
  <text class="rate" x="598.5" y="62" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.6342</tspan></text>
  <text class="rate" x="779" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.4500</tspan></text>
  <text class="rate rate-work" x="953.9" y="55" text-anchor="middle">n<tspan class="exponent" dy="-14">−p<tspan class="subscript" dy="4">sil</tspan></tspan></text>
  <text class="parameter" x="953.9" y="96" text-anchor="middle">p<tspan class="subscript" dy="4">sil</tspan><tspan dy="-4"> = log₂(1+√2) ≈ 1.271553</tspan></text>
  <text class="rate" x="1220" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−1</tspan></text>

