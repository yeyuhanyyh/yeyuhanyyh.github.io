<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Progress on bounds for non-anytime and anytime gradient descent</title>
  <desc id="desc">A two-row rate diagram on one shared linear exponent scale. The upper row shows non-anytime bounds, with the exponent 1.6342 labeled Previous blog. The lower row shows anytime bounds, with the exponent 1.2408 labeled This work.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e2b27"/>
    </marker>
    <style>
      .rate { font-family: Georgia, "Times New Roman", serif; font-size: 32px; font-style: italic; fill: #2e2b27; }
      .exponent { font-size: 19px; font-style: normal; }
      .guide { stroke: #3d4934; stroke-width: 2; stroke-dasharray: 7 7; }
      .block { font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-weight: 700; text-anchor: middle; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .lower { fill: #7a3518; }
      .highlight { fill: #4b2500; font-weight: 800; }
      .upper { fill: #285421; }
      .row-label { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-style: italic; font-weight: 700; fill: #6f6a63; }
    </style>
  </defs>

  <rect width="1400" height="430" fill="#fffdf8"/>

  <!-- One shared linear exponent scale: x(p)=260+930(2-p). -->
  <!-- Non-anytime exponent labels. -->
  <text class="rate" x="260" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−2</tspan></text>
  <text class="rate" x="323" y="58" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.932</tspan></text>
  <text class="rate" x="509" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.733</tspan></text>
  <text class="rate" x="600" y="58" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.6342</tspan></text>
  <text class="rate" x="938" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.271</tspan></text>
  <text class="rate" x="1190" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−1</tspan></text>

  <line class="guide" x1="260" y1="120" x2="260" y2="145"/>
  <line class="guide" x1="323" y1="66" x2="323" y2="145"/>
  <line class="guide" x1="509" y1="120" x2="509" y2="145"/>
  <line class="guide" x1="600" y1="66" x2="600" y2="145"/>
  <line class="guide" x1="938" y1="120" x2="938" y2="145"/>
  <line class="guide" x1="1190" y1="120" x2="1190" y2="145"/>

  <text class="row-label" x="45" y="135">Non-Anytime</text>

  <!-- Non-anytime row. -->
  <rect x="40" y="145" width="220" height="75" fill="#e7ac8a"/>
  <rect x="260" y="145" width="63" height="75" fill="#eec8b1"/>
  <rect x="323" y="145" width="186" height="75" fill="#f8d786"/>
  <rect x="509" y="145" width="91" height="75" fill="#f4c453"/>
  <rect x="600" y="145" width="338" height="75" fill="#fffdf8"/>
  <rect x="938" y="145" width="252" height="75" fill="#ddefd3"/>
  <rect x="1190" y="145" width="180" height="75" fill="#bde3a7"/>

  <text class="block lower" x="150" y="173"><tspan x="150">Nemirovsky &amp; Yudin</tspan><tspan x="150" dy="23">(1983)</tspan></text>
  <text class="block lower tiny" x="291.5" y="162"><tspan x="291.5">Ma &amp;</tspan><tspan x="291.5" dy="18">Chen</tspan><tspan x="291.5" dy="18">(2026)</tspan></text>
  <text class="block lower" x="416" y="173"><tspan x="416">Tsai</tspan><tspan x="416" dy="23">(2026)</tspan></text>
  <text class="block highlight small" x="554.5" y="173"><tspan x="554.5">Previous</tspan><tspan x="554.5" dy="22">blog</tspan></text>
  <text class="block upper" x="1064" y="173"><tspan x="1064">Altschuler &amp; Parrilo</tspan><tspan x="1064" dy="23">(2024)</tspan></text>
  <text class="block upper small" x="1280" y="162"><tspan x="1280">Levitin &amp;</tspan><tspan x="1280" dy="18">Polyak</tspan><tspan x="1280" dy="18">(1966)</tspan></text>

  <!-- Shared center line. -->
  <line x1="40" y1="220" x2="1385" y2="220" stroke="#2e2b27" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Anytime row. -->
  <rect x="40" y="220" width="220" height="75" fill="#e7ac8a"/>
  <rect x="260" y="220" width="620" height="75" fill="#eec8b1"/>
  <rect x="880" y="220" width="86" height="75" fill="#f4c453"/>
  <rect x="966" y="220" width="113" height="75" fill="#fffdf8"/>
  <rect x="1079" y="220" width="111" height="75" fill="#ddefd3"/>
  <rect x="1190" y="220" width="180" height="75" fill="#bde3a7"/>

  <text class="block lower" x="150" y="248"><tspan x="150">Nemirovsky &amp; Yudin</tspan><tspan x="150" dy="23">(1983)</tspan></text>
  <text class="block lower" x="570" y="248"><tspan x="570">Tsai et al.</tspan><tspan x="570" dy="23">(2026)</tspan></text>
  <text class="block highlight small" x="923" y="263">This work</text>
  <text class="block upper small" x="1134.5" y="248"><tspan x="1134.5">Zhang et al.</tspan><tspan x="1134.5" dy="22">(2025)</tspan></text>
  <text class="block upper small" x="1280" y="237"><tspan x="1280">Levitin &amp;</tspan><tspan x="1280" dy="18">Polyak</tspan><tspan x="1280" dy="18">(1966)</tspan></text>

  <text class="row-label" x="45" y="324">Anytime</text>

  <!-- Anytime exponent labels. -->
  <line class="guide" x1="260" y1="295" x2="260" y2="338"/>
  <line class="guide" x1="880" y1="295" x2="880" y2="382"/>
  <line class="guide" x1="966" y1="295" x2="966" y2="338"/>
  <line class="guide" x1="1079" y1="295" x2="1079" y2="382"/>
  <line class="guide" x1="1190" y1="295" x2="1190" y2="338"/>

  <text class="rate" x="260" y="370" text-anchor="middle">n<tspan class="exponent" dy="-14">−2</tspan></text>
  <text class="rate" x="880" y="414" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.334</tspan></text>
  <text class="rate" x="966" y="370" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.2408</tspan></text>
  <text class="rate" x="1079" y="414" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.119</tspan></text>
  <text class="rate" x="1190" y="370" text-anchor="middle">n<tspan class="exponent" dy="-14">−1</tspan></text>
</svg>
