<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
  <title id="title">Lower and upper bounds for non-anytime and anytime gradient descent</title>
  <desc id="desc">Two aligned exponent tracks. The upper non-anytime track highlights this blog at exponent 1.6342. The lower anytime track highlights the next blog at exponent 1.2408.</desc>

  <defs>
    <style>
      .rate {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 32px;
        font-style: italic;
        fill: #272b2f;
      }
      .exponent {
        font-size: 18px;
        font-style: normal;
      }
      .guide {
        stroke: #4b5358;
        stroke-width: 1.8;
        stroke-dasharray: 6 7;
      }
      .track {
        stroke: #afb6bb;
        stroke-width: 2.2;
      }
      .segment {
        stroke-width: 10;
        stroke-linecap: butt;
      }
      .segment.work {
        stroke-width: 14;
      }
      .name {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        font-weight: 700;
        text-anchor: middle;
      }
      .name-small {
        font-size: 15px;
      }
      .row-label {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 20px;
        font-style: italic;
        font-weight: 700;
        text-anchor: middle;
        fill: #666b6e;
      }
      .side-label {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 18px;
        font-style: italic;
        font-weight: 700;
        fill: #666b6e;
      }
      .rate-work {
        font-weight: 700;
        fill: #111111;
      }
      .work-flag-line {
        fill: none;
        stroke: #242628;
        stroke-width: 3.1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .work-flag-cloth {
        fill: #f04b42;
        stroke: #242628;
        stroke-width: 1.6;
        stroke-linejoin: round;
      }
      .lower-a { stroke: #ad5c37; fill: #874323; }
      .lower-b { stroke: #d1926e; fill: #9d5b3a; }
      .lower-c { stroke: #e2b15b; fill: #9a6914; }
      .work { stroke: #bf6f00; fill: #7a4300; }
      .upper-a { stroke: #83ad74; fill: #426b3d; }
      .upper-b { stroke: #4f8150; fill: #315b34; }
      .name.lower-a,
      .name.lower-b,
      .name.lower-c,
      .name.work,
      .name.upper-a,
      .name.upper-b {
        paint-order: stroke fill;
        stroke: #ffffff;
        stroke-width: 5px;
        stroke-linejoin: round;
      }
    </style>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555c60"/>
    </marker>
  </defs>

  <rect width="1400" height="540" fill="#ffffff"/>

  <!-- Non-anytime exponent labels. -->
  <text class="rate" x="240" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−2</tspan></text>
  <text class="rate" x="306.6" y="62" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.932</tspan></text>
  <text class="rate" x="502.7" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.7321</tspan></text>
  <text class="rate rate-work" x="598.5" y="62" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.6342</tspan></text>
  <text class="rate" x="953.8" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.2716</tspan></text>
  <text class="rate" x="1220" y="112" text-anchor="middle">n<tspan class="exponent" dy="-14">−1</tspan></text>

  <line class="guide" x1="240" y1="123" x2="240" y2="199"/>
  <line class="guide" x1="306.6" y1="73" x2="306.6" y2="199"/>
  <line class="guide" x1="502.7" y1="123" x2="502.7" y2="199"/>
  <line class="guide" x1="598.5" y1="73" x2="598.5" y2="199"/>
  <line class="guide" x1="953.8" y1="123" x2="953.8" y2="199"/>
  <line class="guide" x1="1220" y1="123" x2="1220" y2="199"/>

  <!-- Non-anytime track and frontier segments. -->
  <line class="track" x1="60" y1="205" x2="1370" y2="205" marker-end="url(#axis-arrow)"/>
  <line class="segment lower-a" x1="60" y1="205" x2="240" y2="205"/>
  <line class="segment lower-b" x1="240" y1="205" x2="306.6" y2="205"/>
  <line class="segment lower-c" x1="306.6" y1="205" x2="502.7" y2="205"/>
  <line class="segment work" x1="502.7" y1="205" x2="598.5" y2="205"/>
  <line class="segment upper-a" x1="953.8" y1="205" x2="1220" y2="205"/>
  <line class="segment upper-b" x1="1220" y1="205" x2="1340" y2="205"/>

  <text class="name lower-a" x="145" y="172"><tspan x="145">Nemirovsky &amp; Yudin</tspan><tspan x="145" dy="19">(1983)</tspan></text>
  <text class="name name-small lower-b" x="273.3" y="145"><tspan x="273.3">Ma &amp; Chen</tspan><tspan x="273.3" dy="18">(2026)</tspan></text>
  <text class="name lower-c" x="404.7" y="172"><tspan x="404.7">Tsai</tspan><tspan x="404.7" dy="19">(2026)</tspan></text>
  <text class="name name-small work" x="550.6" y="164">This work</text>
  <text class="name upper-a" x="1086.9" y="172"><tspan x="1086.9">Altschuler &amp; Parrilo</tspan><tspan x="1086.9" dy="19">(2024)</tspan></text>
  <text class="name name-small upper-b" x="1285" y="172"><tspan x="1285">Levitin &amp; Polyak</tspan><tspan x="1285" dy="18">(1966)</tspan></text>
  <g aria-hidden="true" transform="translate(598.5 253)">
    <line class="work-flag-line" x1="-10" y1="0" x2="10" y2="0"/>
    <line class="work-flag-line" x1="0" y1="0" x2="0" y2="-28"/>
    <path class="work-flag-cloth" d="M 0 -29 L 17 -22.5 L 0 -16 Z"/>
  </g>
  <text class="row-label" x="720" y="245">Non-anytime</text>

  <!-- Anytime track and frontier segments. -->
  <text class="row-label" x="680" y="315">Anytime</text>
  <line class="track" x1="60" y1="340" x2="1370" y2="340" marker-end="url(#axis-arrow)"/>
  <line class="segment lower-a" x1="60" y1="340" x2="240" y2="340"/>
  <line class="segment lower-b" x1="240" y1="340" x2="893.3" y2="340"/>
  <line class="segment work" x1="893.3" y1="340" x2="984" y2="340"/>
  <line class="segment upper-a" x1="1103.4" y1="340" x2="1220" y2="340"/>
  <line class="segment upper-b" x1="1220" y1="340" x2="1340" y2="340"/>

  <text class="name lower-a" x="145" y="368"><tspan x="145">Nemirovsky &amp; Yudin</tspan><tspan x="145" dy="19">(1983)</tspan></text>
  <text class="name lower-b" x="566.7" y="368"><tspan x="566.7">Tsai et al.</tspan><tspan x="566.7" dy="19">(2026)</tspan></text>
  <text class="name name-small work" x="938.65" y="373">Next blog</text>
  <text class="name name-small upper-a" x="1157" y="368"><tspan x="1157">Zhang et al.</tspan><tspan x="1157" dy="18">(2025)</tspan></text>
  <text class="name name-small upper-b" x="1285" y="368"><tspan x="1285">Levitin &amp; Polyak</tspan><tspan x="1285" dy="18">(1966)</tspan></text>
  <g aria-hidden="true" transform="translate(984 329)">
    <line class="work-flag-line" x1="-10" y1="0" x2="10" y2="0"/>
    <line class="work-flag-line" x1="0" y1="0" x2="0" y2="-28"/>
    <path class="work-flag-cloth" d="M 0 -29 L 17 -22.5 L 0 -16 Z"/>
  </g>

  <!-- Anytime exponent labels. -->
  <line class="guide" x1="240" y1="346" x2="240" y2="440"/>
  <line class="guide" x1="893.3" y1="346" x2="893.3" y2="440"/>
  <line class="guide" x1="984" y1="346" x2="984" y2="480"/>
  <line class="guide" x1="1103.4" y1="346" x2="1103.4" y2="440"/>
  <line class="guide" x1="1220" y1="346" x2="1220" y2="480"/>

  <text class="rate" x="240" y="470" text-anchor="middle">n<tspan class="exponent" dy="-14">−2</tspan></text>
  <text class="rate" x="893.3" y="470" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.3334</tspan></text>
  <text class="rate rate-work" x="984" y="510" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.2408</tspan></text>
  <text class="rate" x="1103.4" y="470" text-anchor="middle">n<tspan class="exponent" dy="-14">−1.119</tspan></text>
  <text class="rate" x="1220" y="510" text-anchor="middle">n<tspan class="exponent" dy="-14">−1</tspan></text>

  <text class="side-label" x="65" y="280">Lower bound</text>
  <text class="side-label" x="1335" y="280" text-anchor="end">Upper bound</text>
</svg>
