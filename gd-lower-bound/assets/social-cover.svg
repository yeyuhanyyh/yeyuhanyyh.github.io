<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Progress on lower bounds for non-anytime gradient descent</title>
  <desc id="desc">A rate diagram for non-anytime gradient descent, labeled Lower bound on the left and Upper bound on the right, highlighting this work at an exponent of 1.6342.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .rate { font-family: Georgia, "Times New Roman", serif; font-size: 48px; font-style: italic; fill: #111111; }
      .exponent { font-size: 27px; font-style: normal; }
      .guide { stroke: #111111; stroke-width: 2.5; stroke-dasharray: 8 8; }
      .block { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .lower { fill: #7a3518; }
      .ours { fill: #4b2500; font-size: 21px; font-weight: 800; }
      .upper { fill: #285421; }
      .small { font-size: 16px; }
      .axis-label { font-family: Georgia, "Times New Roman", serif; font-size: 23px; font-style: italic; fill: #6f6a63; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="625" rx="26" fill="#ffffff" stroke="#d6dde3" stroke-width="2"/>

  <text class="rate" x="215" y="238" text-anchor="middle">n<tspan class="exponent" dy="-19">−2</tspan></text>
  <text class="rate" x="325" y="150" text-anchor="middle">n<tspan class="exponent" dy="-19">−1.932</tspan></text>
  <text class="rate" x="475" y="238" text-anchor="middle">n<tspan class="exponent" dy="-19">−1.733</tspan></text>
  <text class="rate" x="625" y="150" text-anchor="middle">n<tspan class="exponent" dy="-19">−1.6342</tspan></text>
  <text class="rate" x="840" y="238" text-anchor="middle">n<tspan class="exponent" dy="-19">−1.271</tspan></text>
  <text class="rate" x="1040" y="238" text-anchor="middle">n<tspan class="exponent" dy="-19">−1</tspan></text>

  <line class="guide" x1="215" y1="255" x2="215" y2="360"/>
  <line class="guide" x1="325" y1="168" x2="325" y2="360"/>
  <line class="guide" x1="475" y1="255" x2="475" y2="360"/>
  <line class="guide" x1="625" y1="168" x2="625" y2="360"/>
  <line class="guide" x1="840" y1="255" x2="840" y2="360"/>
  <line class="guide" x1="1040" y1="255" x2="1040" y2="360"/>

  <rect x="25" y="360" width="190" height="110" fill="#e7ac8a"/>
  <rect x="215" y="360" width="110" height="110" fill="#eec8b1"/>
  <rect x="325" y="360" width="150" height="110" fill="#f8d786"/>
  <rect x="475" y="360" width="150" height="110" fill="#f4c453"/>
  <rect x="625" y="360" width="215" height="110" fill="#ffffff"/>
  <rect x="840" y="360" width="200" height="110" fill="#ddefd3"/>
  <rect x="1040" y="360" width="135" height="110" fill="#bde3a7"/>

  <text class="block lower small" x="120" y="403"><tspan x="120">Nemirovsky &amp; Yudin</tspan><tspan x="120" dy="29">(1983)</tspan></text>
  <text class="block lower small" x="270" y="403"><tspan x="270">Ma &amp; Chen</tspan><tspan x="270" dy="29">(2026)</tspan></text>
  <text class="block lower" x="400" y="403"><tspan x="400">Tsai</tspan><tspan x="400" dy="29">(2026)</tspan></text>
  <text class="block ours" x="550" y="424">This work</text>
  <text class="block upper" x="940" y="403"><tspan x="940">Altschuler &amp; Parrilo</tspan><tspan x="940" dy="29">(2024)</tspan></text>
  <text class="block upper small" x="1107.5" y="391"><tspan x="1107.5">Levitin &amp;</tspan><tspan x="1107.5" dy="25">Polyak</tspan><tspan x="1107.5" dy="25">(1966)</tspan></text>

  <line x1="25" y1="470" x2="1182" y2="470" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="axis-label" x="34" y="515">Lower bound</text>
  <text class="axis-label" x="1166" y="515" text-anchor="end">Upper bound</text>
</svg>
