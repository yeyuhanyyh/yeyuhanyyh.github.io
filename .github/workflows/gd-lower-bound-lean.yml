name: GD lower-bound Lean formalization

on:
  push:
    branches: [lean-gd-lower-bound-formalization]
    paths:
      - 'gd-lower-bound/lean/**'
      - '.github/workflows/gd-lower-bound-lean.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lean and Mathlib package cache
        id: lean-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            gd-lower-bound/lean/.lake/packages
          key: gd-lower-bound-lean-v4.32.2-mathlib-v4.32.2-v2
      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Update dependencies and fetch Mathlib cache
        working-directory: gd-lower-bound/lean
        run: |
          set -o pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update 2>&1 | tee lean-setup.log
          lake exe cache get 2>&1 | tee -a lean-setup.log
      - name: Save Lean and Mathlib package cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            gd-lower-bound/lean/.lake/packages
          key: gd-lower-bound-lean-v4.32.2-mathlib-v4.32.2-v2
      - name: Build Lean project
        working-directory: gd-lower-bound/lean
        run: |
          set -o pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build 2>&1 | tee lean-build.log
      - name: Reject placeholders and custom axioms
        working-directory: gd-lower-bound/lean
        run: |
          if grep -RInE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' GDLowerBound GDLowerBound.lean; then
            echo 'Found an unproved placeholder or custom axiom.'
            exit 1
          fi
      - name: Upload Lean logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-data
          path: |
            gd-lower-bound/lean/lean-setup.log
            gd-lower-bound/lean/lean-build.log
            gd-lower-bound/lean/lake-manifest.json
          if-no-files-found: warn
