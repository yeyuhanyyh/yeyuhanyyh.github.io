name: Export compiled Ma-Chen Lean dependency

on:
  push:
    branches: [lean-gd-lower-bound-formalization]
    paths:
      - '.github/workflows/gd-lower-bound-machen-export.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch and compile pinned dependency
        working-directory: gd-lower-bound/lean
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build maChenGDLowerBound:GDLowerBound
      - uses: actions/upload-artifact@v4
        with:
          name: machen-gd-lower-bound-package
          path: gd-lower-bound/lean/.lake/packages/maChenGDLowerBound
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error
